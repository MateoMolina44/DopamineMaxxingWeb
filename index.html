<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DopamineMaxxing</title>
<meta name="description" content="DopamineMaxxing: un incremental de mesa. Ruleta, dados, pesca y un ejército que pelea solo. Gratis en el navegador.">
<meta property="og:title" content="DopamineMaxxing">
<meta property="og:description" content="Un incremental de mesa. Jugalo gratis en itch.io.">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/dopamina.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
a{color:#c4470f}a:hover{color:#8f3209}
.stripes-h{background-image:linear-gradient(180deg,#c8231a 0 25%,#e8641e 25% 50%,#f2b134 50% 75%,#2e8f8a 75% 100%)}
.scan{background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.paper{background-image:url(assets/papel.png);background-size:512px 512px;opacity:.8}
/* animaciones */
.press{transition:transform .12s ease,box-shadow .12s ease}
.press:hover{transform:translateY(3px);box-shadow:0 3px 0 #1d1b1a !important}
.press:active{transform:translateY(6px);box-shadow:0 0 0 #1d1b1a !important}
.press-light:hover{box-shadow:0 3px 0 #efe6d4 !important}.press-light:active{box-shadow:0 0 0 #efe6d4 !important}
.press-mini:hover{transform:translateY(2px);box-shadow:0 2px 0 #1d1b1a !important}.press-mini:active{transform:translateY(4px);box-shadow:0 0 0 #1d1b1a !important}
.press-cream:hover{box-shadow:0 2px 0 #8a8070 !important}.press-cream:active{box-shadow:0 0 0 #8a8070 !important}
.navbtn{transition:background .15s,color .15s}.navbtn:hover{background:#e8641e !important;color:#1d1b1a !important}
.tilt{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
li:hover .tilt{transform:rotate(0deg) scale(1.04) !important}
.lift{transition:transform .3s ease}.lift:hover{transform:translateY(-8px)}
.reveal{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.pre{opacity:0;transform:translateY(56px)}

.drop{animation:dmxdrop 1.3s cubic-bezier(.55,0,.35,1) 1.6s both}
@keyframes dmxdrop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.boot>p:first-child{animation:dmxboot .7s linear 2.9s both}
.boot>img{animation:dmxboot 1.1s linear 5s both}
.boot>a{animation:dmxboot .7s linear 6.1s both}
@keyframes dmxboot{0%{opacity:0}12%{opacity:.9}15%{opacity:0}30%{opacity:0}33%{opacity:1}36%{opacity:.15}48%{opacity:.15}52%{opacity:1}56%{opacity:.4}60%{opacity:1}72%{opacity:.6}75%{opacity:1}100%{opacity:1}}
.hit{z-index:3;padding:0;margin:0;background:transparent;border:0;border-radius:40%;cursor:pointer}
.hit:focus-visible{outline:3px dashed #f2b134;outline-offset:2px}
.hit-dice:hover~svg .die{animation-duration:1.2s}
.wheel-hover{animation:dmxspin 60s linear infinite paused}
.hit-wheel:hover~svg .wheel-hover{animation-play-state:running}
@keyframes dmxflow{to{transform:translateY(56px)}}
.type{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:calc(22ch + 1.76em);animation:dmxtype 1.4s steps(22) 3.6s both}
@keyframes dmxtype{from{width:0}}
.type2{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;width:28ch;animation:dmxtype 1.2s steps(28) 6.8s both}
.cursor{animation:dmxblink 1s steps(1) infinite}
@keyframes dmxblink{50%{opacity:0}}
.flicker{animation:dmxflicker 7s linear infinite}
@keyframes dmxflicker{0%,90%,94%,100%{opacity:1}91%{opacity:.4}92%{opacity:1}93%{opacity:.6}}
.pulse{animation:dmxpulse 3.2s ease-in-out infinite}
@keyframes dmxpulse{50%{transform:scale(1.05) rotate(2deg)}}
.ripple{animation:dmxripple 3.4s ease-out infinite}.ripple-2{animation-delay:1.7s}
@keyframes dmxripple{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.25);opacity:0}}
.bob{animation:dmxbob 4s ease-in-out infinite}
@keyframes dmxbob{50%{transform:translateY(-12px)}}
.die{transform-box:fill-box;transform-origin:center;animation:dmxwobble 3.6s ease-in-out infinite}.die-2{animation-delay:-1.8s}
@keyframes dmxwobble{50%{transform:rotate(7deg) translateY(-8px)}}
.die.rolling{animation:dmxshake .8s linear}
@keyframes dmxshake{0%{transform:translate(0,0) rotate(0)}8%{transform:translate(-14px,6px) rotate(-14deg)}16%{transform:translate(12px,-10px) rotate(12deg)}24%{transform:translate(-10px,-4px) rotate(-18deg)}32%{transform:translate(14px,8px) rotate(16deg)}40%{transform:translate(-12px,-12px) rotate(-10deg)}48%{transform:translate(10px,6px) rotate(20deg)}56%{transform:translate(-8px,10px) rotate(-14deg)}64%{transform:translate(8px,-8px) rotate(10deg)}72%{transform:translate(-6px,4px) rotate(-8deg)}80%{transform:translate(4px,-4px) rotate(5deg)}90%{transform:translate(-2px,2px) rotate(-2deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes dmxroll{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(200deg) translateY(-40px)}100%{transform:rotate(360deg) translateY(0)}}
.wheel{animation:dmxspin 40s linear infinite}
.wheel-burst.go{animation:dmxburst 1.6s cubic-bezier(.15,.55,.25,1) both}
@keyframes dmxburst{to{transform:rotate(1440deg)}}
@keyframes dmxspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}.reveal.pre{opacity:1;transform:none}.type{width:calc(22ch + 1.76em)}.type2{width:28ch}.drop{clip-path:none}.intro{display:none}.tree-pulse{display:none}.eeg{stroke-dashoffset:0}}

.intro{animation:dmxintroout .3s ease 1.3s forwards}
@keyframes dmxintroout{to{opacity:0;visibility:hidden}}
.intro-rise{animation:dmxrise 1.3s cubic-bezier(.6,0,.3,1) both}
@keyframes dmxrise{from{transform:translateY(124px)}to{transform:translateY(-114px)}}
.pop{animation:dmxpop .28s cubic-bezier(.2,1.6,.4,1) both}
@keyframes dmxpop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.pop.out{animation:dmxpopout .28s cubic-bezier(.6,-.6,.8,0) both}
@keyframes dmxpopout{to{transform:scale(.2) rotate(-25deg);opacity:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:dmxsway 4.4s ease-in-out infinite alternate}.sway-2{animation-delay:-1.5s}.sway-3{animation-delay:-3s}
@keyframes dmxsway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.rod{transform-box:view-box;transform-origin:-40px 70px;animation:dmxrod 3s ease-in-out infinite alternate}
@keyframes dmxrod{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.fish{transform-box:fill-box;transform-origin:center;animation:dmxfish 2.6s ease-in-out infinite}
@keyframes dmxfish{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(-14deg)}}
.sticker{will-change:transform}
@media (max-width: 700px){.sticker{--stk:.5}}.sticker:active{cursor:grabbing}

.rcpt{transform:translateY(-100%);will-change:transform}
.rcpt.open{transform:translateY(0);animation:dmxprint 2.4s both}
.rcpt.open.instant{animation:none;transition:transform .25s ease-out}
.rcpt.closing{transform:translateY(-100%);animation:dmxretract 1s cubic-bezier(.45,0,.25,1) both}
.rcpt.snap{transition:transform .3s ease-out}
@keyframes dmxretract{from{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes dmxprint{0%{transform:translateY(-100%);animation-timing-function:linear}30%{transform:translateY(-67%);animation-timing-function:steps(1)}32%{transform:translateY(-68.5%)}34%{transform:translateY(-67%)}42%{transform:translateY(-67%);animation-timing-function:linear}68%{transform:translateY(-33%);animation-timing-function:steps(1)}70%{transform:translateY(-34.5%)}72%{transform:translateY(-33%)}80%{transform:translateY(-33%);animation-timing-function:cubic-bezier(.3,0,.4,1)}100%{transform:translateY(0)}}
.rcpt.drag{transition:none !important;animation:none !important}
.rcpt-body{visibility:hidden;transition:visibility 0s .3s}
.rcpt.open .rcpt-body,.rcpt.drag .rcpt-body,.rcpt.closing .rcpt-body,.rcpt.snap .rcpt-body{visibility:visible;transition:visibility 0s}
.rcpt-tab:active{cursor:grabbing}
.paperbg{background-color:#f8f4ea;background-image:url(assets/papel.png);background-size:512px 512px}
.zig{margin-top:-1px;-webkit-mask-image:linear-gradient(135deg,#000 50%,transparent 50%),linear-gradient(225deg,#000 50%,transparent 50%);mask-image:linear-gradient(135deg,#000 50%,transparent 50%),linear-gradient(225deg,#000 50%,transparent 50%);-webkit-mask-size:20px 12px;mask-size:20px 12px;-webkit-mask-repeat:repeat-x;mask-repeat:repeat-x}
.rcpt-tab:focus-visible,.rcpt-link:focus-visible{outline:3px dashed #c8231a;outline-offset:3px}
.rcpt-link .rcpt-arrow{transition:transform .2s ease}
.rcpt-link:hover .rcpt-arrow{transform:translateX(4px) rotate(-12deg)}
.rcpt-link:hover{background:rgba(67,196,99,.12)}
.eeg{stroke-dasharray:1400;stroke-dashoffset:1400}
.rcpt.open .eeg{animation:dmxeeg 2.4s linear 1.6s forwards}
@keyframes dmxeeg{to{stroke-dashoffset:0}}
.rcpt.closing .eeg,.rcpt.snap .eeg,.rcpt.drag .eeg{stroke-dashoffset:0}

.tree-line{stroke-dasharray:1000;stroke-dashoffset:0;transition-property:stroke-dashoffset;transition-timing-function:cubic-bezier(.4,0,.2,1)}
.tree.pre .tree-line{stroke-dashoffset:1000}
.tree-dot{transition:opacity .35s ease 1.6s,transform .35s cubic-bezier(.2,1.6,.4,1) 1.6s;transform-box:fill-box;transform-origin:center}.tree.pre .tree-dot{opacity:0;transform:scale(0)}
.tree-join{transform-box:fill-box;transform-origin:center;transition:transform .3s ease .9s}.tree.pre .tree-join{transform:scale(0)}
.tree:not(.pre) .tree-join{animation:dmxjoin 2.6s ease-in-out 2.2s infinite}
@keyframes dmxjoin{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}
.tree-pulse{opacity:0;transition:opacity .6s ease 2.2s}.tree:not(.pre) .tree-pulse{opacity:.9}
.tree:not(.pre) .tree-node{animation:dmxnode .55s cubic-bezier(.2,1.6,.4,1) var(--d, 0s) backwards}
@keyframes dmxnode{from{transform:translate(-50%,-50%) scale(0)}}
.tree-node{transform:translate(-50%,-50%);box-shadow:0 0 0 #1d1b1a;transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s ease,border-color .2s}
.tree-node:hover{transform:translate(-50%,-50%) scale(1.08);box-shadow:3px 3px 0 #e8641e}
.tree-node.sel{transform:translate(-50%,-50%) scale(1.2);border-color:#c8231a;border-width:3px;box-shadow:6px 6px 0 #e8641e}
.tree-card.c1{animation:dmxcardA .4s cubic-bezier(.2,.8,.2,1) both}.tree-card.c2{animation:dmxcardB .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmxcardA{from{opacity:0;transform:translateX(24px) rotate(1.5deg)}}
@keyframes dmxcardB{from{opacity:0;transform:translateX(24px) rotate(1.5deg)}}
.card-dot.on span{background:#1d1b1a}.card-dot:focus-visible{outline:2px dashed #c8231a}
.tree-info.a1{animation:dmxinfoA .45s cubic-bezier(.2,.8,.2,1) both}.tree-info.a2{animation:dmxinfoB .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes dmxinfoA{from{opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes dmxinfoB{from{opacity:0;transform:translateY(18px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.tree-node:focus-visible{outline:3px dashed #c8231a;outline-offset:6px}
.screen{background-color:#16110e;background-image:radial-gradient(ellipse at center,rgba(232,100,30,.22),transparent 70%)}
/* ================= TELEVISOR CRT ================= */
:root{
  --crt:#140f0c;--fg:#efe6d4;--dim:rgba(239,230,212,.5);--faint:rgba(239,230,212,.22);
  --hud-pad:clamp(14px,2.6vw,40px);
  --band-b:clamp(46px,7vh,64px);--side:clamp(8px,2vw,30px);
  --img-b:clamp(16px,2.4vh,24px); /* borde inferior de la imagen: más abajo que la franja del HUD, así la línea curva del tubo baja */
  --bez:clamp(12px,2.2vw,30px);
  --lift:10vh; /* la imagen arranca por encima del borde: el embudo llega hasta arriba del todo */
  --bleed:4.5vw; /* y se pasa de los costados: lo que va de borde a borde (el diagrama) toca el marco a pesar de la curvatura */
}
html,body{height:100%;overflow:hidden}
body{margin:0;background:#0a0807}
.room{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1c1612,#070605 75%)}
.tv{position:absolute;inset:clamp(6px,1.2vw,16px);border-radius:clamp(22px,4vw,56px);
  background:linear-gradient(160deg,#2a2420,#120e0c 55%,#1b1613);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.06),inset 0 -3px 12px rgba(0,0,0,.8),0 20px 60px rgba(0,0,0,.6)}
.crt{position:absolute;inset:clamp(6px,1vw,14px);border-radius:clamp(18px,3.4vw,46px);overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 50% 45%,#2a1d15 0%,var(--crt) 60%,#0b0806 100%);
  font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--fg)}

/* ---- arranque: negro → pantallazo azul → terminal → se prende ---- */
.crt.off{background:#050403}
.crt.off .warp,.crt.off .hud,.crt.booting .warp,.crt.booting .hud{visibility:hidden}
.term{position:absolute;inset:0;z-index:15;display:none;flex-direction:column;justify-content:flex-start;overflow:hidden;padding:clamp(22px,5vw,72px);font-size:clamp(10.5px,.95vw,14px);line-height:1.6;
  color:#43c463;letter-spacing:.06em;text-shadow:0 0 8px rgba(67,196,99,.55);background:#07100a}
.crt.booting .term{display:flex}
.term.blue{background:#1238c9;color:#e8eeff;text-shadow:none}
.term.blue .ln{display:none}
.term.full{justify-content:flex-end}  /* cuando se llena, las líneas nuevas empujan a las viejas hacia arriba */
.term .ln{margin:0;white-space:pre-wrap;word-break:break-word}
.term .ln .ok{color:#f2b134}
.term .go{color:#efe6d4}
.term .cur{animation:dmxblink 1s steps(1) infinite}
.crt.switch{animation:dmxswitch 1s cubic-bezier(.3,0,.2,1) both}
@keyframes dmxswitch{0%{transform:none;filter:none}28%{transform:scale(1,.004);filter:brightness(6)}48%{transform:scale(1,.004);filter:brightness(6)}75%{transform:scale(1,1.02);filter:brightness(2)}100%{transform:none;filter:none}}

/* el componente: la imagen curvada (.warp) adentro de la tele */
#app,.dmx-shell{display:contents}
.warp{position:absolute;z-index:5;top:calc(-1 * var(--lift));bottom:var(--img-b);left:calc(-1 * var(--bleed));right:calc(-1 * var(--bleed));overflow:hidden;
  filter:url(#dmxWarp);will-change:filter,transform;transform-origin:50% 50%;animation:dmxcrtflick 7s linear infinite}
@keyframes dmxcrtflick{0%,90%,94%,100%{opacity:1}91%{opacity:.85}92%{opacity:1}93%{opacity:.92}}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
/* el contenido vuelve a quedar dentro de lo visible; solo el diagrama usa el ancho completo */
.scroller > div{box-sizing:border-box;padding-left:calc(var(--bleed) + var(--side));padding-right:calc(var(--bleed) + var(--side))}

/* el ticket: afuera de la tele, encima de todo, a la derecha del todo */
#menuRoot{position:fixed;inset:0;z-index:200;pointer-events:none}
#menuRoot .rcpt{position:absolute;top:0;right:clamp(10px,1.8vw,26px);width:min(440px,calc(100% - 20px));pointer-events:auto}
#menuRoot .rcpt-tab{filter:drop-shadow(0 8px 10px rgba(0,0,0,.6)) !important}
@media (max-height:1000px){#menuRoot .rcpt{scale:.84;transform-origin:top right}}
@media (max-height:820px){#menuRoot .rcpt{scale:.72}}
@media (max-height:680px){#menuRoot .rcpt{scale:.6}}

/* capas de vidrio */
.fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.fx-scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.fx-rgb{background:repeating-linear-gradient(90deg,rgba(255,40,40,.04) 0 1px,rgba(40,255,90,.035) 1px 2px,rgba(40,120,255,.04) 2px 3px)}
.fx-vig{background:radial-gradient(ellipse 78% 74% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 86%,rgba(0,0,0,.9) 100%);box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
.fx-glare{background:linear-gradient(115deg,transparent 58%,rgba(255,240,220,.05) 62%,transparent 66%,transparent 72%,rgba(255,240,220,.04) 74%,transparent 79%),radial-gradient(ellipse 60% 40% at 30% 10%,rgba(255,235,210,.06),transparent 70%)}
.fx-roll{background:linear-gradient(180deg,transparent,rgba(255,235,210,.06) 50%,transparent);height:22%;animation:dmxcrtroll 7s linear infinite}
@keyframes dmxcrtroll{from{transform:translateY(-120%)}to{transform:translateY(560%)}}
.fx-noise{opacity:.07;background-size:220px 220px;animation:dmxcrtnoise .5s steps(5) infinite}
@keyframes dmxcrtnoise{0%{background-position:0 0}25%{background-position:-60px 40px}50%{background-position:80px -30px}75%{background-position:-20px -90px}100%{background-position:0 0}}

/* HUD de abajo */
.hud{position:absolute;left:0;right:0;bottom:0;height:var(--band-b);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 calc(var(--side) + var(--hud-pad)*.6);font-size:clamp(10px,.8vw,12.5px);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;
  text-shadow:.6px 0 rgba(255,40,70,.45),-.6px 0 rgba(60,200,255,.4)}
.hud .l{justify-self:start}.hud .r{justify-self:end}.hud .mid{justify-self:center}
.hud .sub{color:var(--dim);font-size:.85em}
.ticks{display:flex;gap:3px;align-items:flex-end;height:12px}
.ticks i{width:2px;height:100%;background:var(--faint)}
.ticks i.on{background:var(--fg)}
.ticks i.hd{background:#e8641e}

/* hero: intro de colores → el embudo cae desde arriba del todo y entra en el logo */
.hero{--vh-img:calc(100vh - var(--img-b) - 2*var(--bez));position:relative;isolation:isolate;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.hero.dragging{cursor:grabbing}
.hero-track{position:relative;will-change:transform}
.hero-main{box-sizing:border-box;min-height:calc(var(--vh-img) + var(--lift));display:flex;flex-direction:column;align-items:center;padding:0 24px clamp(48px,8.5vh,84px);text-align:center}
/* 2) fondo del hero: el cyan del header original, atenuado, que se va fundiendo en el gris de la tele */
.hero::before{content:"";position:absolute;z-index:-1;top:0;bottom:-40vh;left:calc(-1 * (24px + var(--bleed) + var(--side)));right:calc(-1 * (24px + var(--bleed) + var(--side)));pointer-events:none;
  background:radial-gradient(rgba(0,0,0,.16) 1px,transparent 1.4px) 0 0/5px 5px,linear-gradient(180deg,rgba(72,186,178,.52) 0%,rgba(72,186,178,.38) 30%,rgba(72,186,178,.2) 58%,rgba(72,186,178,.07) 82%,rgba(72,186,178,0) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.hero .drop{-webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 96%);mask-image:linear-gradient(180deg,#000 62%,transparent 96%);animation-delay:1.5s;width:min(100%,calc((var(--vh-img) * .42 + var(--lift)) * 1.6)) !important}
.hero-logo{position:relative;z-index:2;width:min(820px,94%,calc(var(--vh-img) * .74));height:auto;display:block;margin-top:calc(var(--vh-img) * -.19);
  animation:dmxlogoin 1s cubic-bezier(.2,.9,.25,1.15) 2.6s both,dmxlogoglow 2.6s ease-in-out 3.6s infinite}
@keyframes dmxlogoin{0%{opacity:0;transform:translateY(-70px) scale(.55);filter:brightness(3) blur(6px)}55%{opacity:1;transform:translateY(6px) scale(1.06);filter:brightness(1.6) blur(0)}100%{opacity:1;transform:none;filter:drop-shadow(0 0 26px rgba(232,100,30,.45))}}
@keyframes dmxlogoglow{0%,100%{filter:drop-shadow(0 0 22px rgba(232,100,30,.35))}50%{filter:drop-shadow(0 0 40px rgba(242,177,52,.6))}}
.hero-cta{margin-top:clamp(30px,5vh,56px);display:flex;flex-direction:column;align-items:center;gap:12px;animation:dmxherofade .7s ease 3.5s both}
.hero-note{margin:0;font-size:13px;color:#f2b134}
.hero .type2{animation-delay:3.9s}
@keyframes dmxherofade{from{opacity:0;transform:translateY(14px)}}

/* diagrama de niveles de dopamina: corre a la izquierda; lo que dibujás con el mouse queda grabado */
.eegbox{--out:calc(24px + var(--bleed) + var(--side));position:relative;box-sizing:border-box;width:calc(100% + 2 * var(--out));margin-left:calc(-1 * var(--out));margin-right:calc(-1 * var(--out));height:clamp(58px,8.5vh,78px);margin-top:auto;cursor:crosshair;touch-action:none;
  border-top:1px dashed var(--faint);border-bottom:1px dashed var(--faint);padding-top:18px;animation:dmxherofade .7s ease 4.1s both}
.eegbox svg{width:100%;height:100%;display:block;overflow:visible}
.eegbox .base{stroke:var(--faint);stroke-dasharray:3 4}
.eegbox .sig{fill:none;stroke:#43c463;stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(67,196,99,.6))}

<script>
/* ================= TELEVISOR CRT ================= */
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const crt = $('crt'), term = $('term');
const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));

/* ---- número de sesión real: contador compartido (Abacus, servicio gratuito) ----
   Cada apertura de la página suma 1. Si el servicio no responde, se muestra "------". */
const SESSION_URL = 'https://abacus.jasoncameron.dev/hit/dopaminemaxxing-web/sitio';
const session = fetch(SESSION_URL).then((r) => r.ok ? r.json() : Promise.reject(r.status)).then((j) => {
  const n = String(j.value).padStart(6, '0');
  window.__dmxSession = n;
  window.dispatchEvent(new CustomEvent('dmx:session', { detail: n }));
  return n;
}).catch(() => '------');

/* ================= SONIDO =================
   Todo se sintetiza con Web Audio (no hay archivos). Los navegadores no dejan sonar nada
   hasta el primer click o tecla, así que el audio se habilita ahí. El botón del HUD lo silencia
   y la elección se recuerda en este navegador. */
const SFX = (() => {
  let ctx = null, master = null, out = null, nbuf = null, hissG = null, muted = false, iosKick = false;
  /* JERARQUÍA SONORA: cuánto pesa cada sonido según la importancia del elemento (multiplica su volumen propio)
     1 · momentos clave ............ JUGAR, el logo que aterriza, el encendido de la tele
     2 · interacciones principales . dados, ruleta, abrir/cerrar el ticket, pasar al pitch
     3 · respuestas chicas ......... links del menú y del pitch, monedas, imágenes, nodos y botones menores
     4 · ambiente ................... terminal, intro de colores, interferencia del diagrama, siseo del scroll */
  const LEVEL = {
    start: 1, slam: 0.9, on: 0.75, flash: 0.6,
    dice: 0.8, wheel: 0.8, print: 0.7, retract: 0.65, printQuick: 0.6, retractQuick: 0.6, stat: 0.65,
    nav: 0.55, coin: 0.55, zoomIn: 0.5, zoomOut: 0.4, blip: 0.4, beep: 0.4, printIn: 0.45,
    drop: 0.4, rise: 0.3, tick: 0.25, zap: 0.22
  };
  const VOL = 1.6;
  try { muted = localStorage.getItem('dmx-mute') === '1'; } catch (e) {}
  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : VOL;
    /* compresor: deja subir el volumen sin que se sature cuando suenan varias cosas juntas */
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    master.connect(comp).connect(ctx.destination);
    nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    /* siseo continuo que sube con la velocidad del scroll */
    const src = ctx.createBufferSource(); src.buffer = nbuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 0.7;
    hissG = ctx.createGain(); hissG.gain.value = 0;
    src.connect(bp).connect(hissG).connect(master); src.start();
  }
  function unlock() {
    /* iPhone: con la llave de silencio puesta, Web Audio queda mudo salvo que la página
       se declare como reproducción (audioSession) o arranque un <audio> en el mismo gesto */
    if (!iosKick) {
      iosKick = true;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      try {
        const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');
        a.setAttribute('playsinline', ''); a.volume = 0; const p = a.play(); if (p) p.catch(() => {});
      } catch (e) {}
    }
    init();
    if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  }
  ['pointerdown', 'mousedown', 'touchend', 'keydown', 'click'].forEach((ev) => window.addEventListener(ev, unlock, { capture: true, passive: true }));
  const live = () => ctx && ctx.state === 'running' && !muted;
  function tone(o) {
    const t = ctx.currentTime + (o.t || 0), dur = o.dur || 0.08;
    const os = ctx.createOscillator(), g = ctx.createGain();
    os.type = o.type || 'square';
    os.frequency.setValueAtTime(o.f, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t + (o.a || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    os.connect(g).connect(out || master); os.start(t); os.stop(t + dur + 0.02);
  }
  function noise(o) {
    const t = ctx.currentTime + (o.t || 0), dur = o.dur || 0.05;
    const src = ctx.createBufferSource(); src.buffer = nbuf; src.loop = true;   /* los ruidos largos no se cortan */
    const f = ctx.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t + (o.a || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(out || master); src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.02);
  }
  /* motor paso a paso de la impresora térmica: tics que van de r0 a r1 por segundo + zumbido grave */
  function motor(t0, dur, r0, r1, vol) {
    /* impresora de tickets real: el motor paso a paso chilla agudo (sube y baja con la velocidad del papel),
       el cabezal térmico hace un raspado fino y cada línea impresa es un tic seco */
    const s0 = ctx.currentTime + t0, e0 = s0 + dur;
    const g = ctx.createGain(), bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(r0 * 52, s0); bp.frequency.linearRampToValueAtTime(r1 * 52, e0);
    g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(vol * 0.55, s0 + 0.02);
    g.gain.setValueAtTime(vol * 0.55, Math.max(s0 + 0.03, e0 - 0.03)); g.gain.exponentialRampToValueAtTime(0.0001, e0);
    bp.connect(g).connect(out || master);
    [[24, 'square'], [36.2, 'sawtooth']].forEach(([k, type]) => {     /* dos tonos del motor, levemente desafinados */
      const os = ctx.createOscillator(); os.type = type;
      os.frequency.setValueAtTime(r0 * k, s0); os.frequency.linearRampToValueAtTime(r1 * k, e0);
      const lfo = ctx.createOscillator(), lg = ctx.createGain();   /* vibrato rápido: el traqueteo de los pasos */
      lfo.frequency.value = 38; lg.gain.value = r0 * k * 0.02; lfo.connect(lg).connect(os.frequency);
      os.connect(bp); os.start(s0); os.stop(e0 + 0.02); lfo.start(s0); lfo.stop(e0 + 0.02);
    });
    noise({ ft: 'highpass', f: 6000, q: 0.7, dur, vol: vol * 0.35, a: 0.02, t: t0 });   /* raspado del cabezal */
    let t = 0;
    while (t < dur) {
      const r = r0 + (r1 - r0) * (t / dur);
      noise({ f: 5200 + Math.random() * 1500, q: 5, dur: 0.008, vol: vol * 0.8, t: t0 + t });
      t += 1 / (r * 0.5);
    }
  }
  /* el papel se traba: golpe seco */
  function clack(t0, vol) { noise({ f: 3200, q: 1.2, dur: 0.035, vol, t: t0 }); tone({ f: 900, f2: 500, dur: 0.03, vol: vol * 0.25, t: t0 }); }
  const S = {
    /* arranque */
    flash() { tone({ f: 120, f2: 55, type: 'sawtooth', dur: 0.28, vol: 0.03 }); noise({ f: 900, q: 0.6, dur: 0.22, vol: 0.025 }); },
    tick() { noise({ f: 4200, q: 3, dur: 0.012, vol: 0.035 }); },
    beep() { tone({ f: 988, dur: 0.14, vol: 0.05 }); },
    on() {
      noise({ ft: 'lowpass', f: 400, dur: 0.18, vol: 0.13 });                         /* golpe del relé */
      tone({ f: 70, f2: 40, type: 'sine', dur: 0.5, vol: 0.1 });                       /* zumbido del tubo */
      noise({ f: 2500, f2: 6000, q: 0.5, dur: 0.6, vol: 0.025, t: 0.05 });             /* estática */
      tone({ f: 7800, type: 'sine', dur: 1.4, vol: 0.005, a: 0.2, t: 0.1 });            /* chillido agudo del fly-back */
    },
    /* intro de colores: sube el amarillo, cae el embudo y aterriza el logo */
    rise() { tone({ f: 110, f2: 880, type: 'triangle', dur: 1.25, vol: 0.07, a: 0.3 }); noise({ f: 500, f2: 4000, q: 0.7, dur: 1.2, vol: 0.05, a: 0.5 }); },
    /* el arcoíris cae dentro del logo: un acorde de seis voces (una por franja de color) que se desliza
       dos octavas hacia abajo, con un soplido que se va cerrando y un brillo que se apaga al principio */
    drop() {
      [1319, 1175, 988, 880, 740, 659].forEach((f, i) => {
        tone({ f, f2: f / 4, type: 'triangle', dur: 1.2 - i * 0.03, vol: 0.032, a: 0.18, t: i * 0.035 });
        tone({ f: f * 1.005, f2: f / 4.02, type: 'sine', dur: 1.1, vol: 0.02, a: 0.2, t: i * 0.035 });   /* voz gemela, apenas desafinada */
      });
      noise({ ft: 'lowpass', f: 7000, f2: 260, q: 0.9, dur: 1.25, vol: 0.07, a: 0.3 });               /* soplido que cae */
      [2637, 3136, 3520].forEach((f, i) => tone({ f, type: 'sine', dur: 0.35, vol: 0.012, t: 0.05 + i * 0.07 }));   /* destello inicial */
    },
    slam() {
      noise({ ft: 'lowpass', f: 260, dur: 0.45, vol: 0.5 });                              /* golpe */
      tone({ f: 82, f2: 30, type: 'sine', dur: 1.1, vol: 0.4, a: 0.006 });                /* sub grave que cae */
      const s0 = ctx.currentTime, os = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
      os.type = 'sawtooth'; os.frequency.setValueAtTime(65, s0); os.frequency.exponentialRampToValueAtTime(41, s0 + 0.9);
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, s0); lp.frequency.exponentialRampToValueAtTime(140, s0 + 0.9);
      g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.16, s0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, s0 + 1);
      os.connect(lp).connect(g).connect(out || master); os.start(s0); os.stop(s0 + 1.05);             /* cuerpo áspero */
      [131, 196, 262, 330, 392].forEach((f, i) => tone({ f, type: 'triangle', dur: 1.1 - i * 0.08, vol: 0.05, a: 0.01, t: 0.03 + i * 0.02 }));
      [523, 659].forEach((f, i) => tone({ f, dur: 0.5, vol: 0.02, t: 0.08 + i * 0.03 }));   /* brillo arriba */
    },
    /* botones */
    blip() { tone({ f: 620, f2: 940, dur: 0.06, vol: 0.06 }); },
    start() { [523, 659, 784, 1047].forEach((f, i) => tone({ f, dur: i === 3 ? 0.35 : 0.11, vol: 0.11, t: i * 0.065 })); tone({ f: 131, type: 'triangle', dur: 0.45, vol: 0.08, t: 0.2 }); },
    nav() { tone({ f: 700, f2: 1050, dur: 0.07, vol: 0.07 }); tone({ f: 1400, dur: 0.05, vol: 0.025, t: 0.05 }); },
    /* imagen ampliada: sube al abrir, baja al cerrar */
    zoomIn() { tone({ f: 330, f2: 990, type: 'triangle', dur: 0.18, vol: 0.08 }); noise({ f: 3000, q: 0.6, dur: 0.12, vol: 0.03 }); },
    zoomOut() { tone({ f: 880, f2: 300, type: 'triangle', dur: 0.15, vol: 0.07 }); },
    /* ticket: impresora térmica / papel que se corta */
    /* abrir (2,4 s): imprime, se traba, pausa, imprime, se traba, pausa y sale el último tramo frenando */
    print() {
      motor(0, 0.72, 55, 55, 0.07); clack(0.72, 0.12); clack(0.79, 0.07);
      motor(1.01, 0.62, 55, 55, 0.07); clack(1.63, 0.12); clack(1.70, 0.07);
      motor(1.92, 0.48, 50, 16, 0.07);
    },
    /* entrada del ticket al cargar (1,5 s): mismos cortes que la animación */
    printIn() {
      motor(0, 0.42, 55, 55, 0.065); clack(0.42, 0.11); clack(0.45, 0.06);
      motor(0.48, 0.39, 55, 55, 0.065); clack(0.87, 0.11); clack(0.9, 0.06);
      motor(0.93, 0.33, 50, 16, 0.065); clack(1.26, 0.05);
    },
    /* cerrar (1 s, arranca y frena): el mismo motor, al ritmo de la animación */
    retract() { motor(0, 0.5, 18, 70, 0.07); motor(0.5, 0.5, 70, 18, 0.07); },
    /* abrir o cerrar arrastrando: tramo corto */
    printQuick() { motor(0, 0.25, 60, 30, 0.065); },
    retractQuick() { motor(0, 0.3, 60, 22, 0.065); },
    /* 6) interferencia al pasar el mouse por el diagrama */
    zap() {
      noise({ f: 1500 + Math.random() * 4000, q: 1.5, dur: 0.03 + Math.random() * 0.04, vol: 0.045 });

    },

        p[k] = Math.round(255 * (u * KX * r2 * W / 2 / scale + 0.5));

      const x = CW - k / 48 * CW, u = (x - L) / W * 2 - 1;
      let v = 0.9; for (let it = 0; it < 16; it++) v = 1 / (1 + KY * (u * u + v * v));

  const rail = $('rail'), railTxt = $('railTxt');

  /* monedas y fichas flotando en los márgenes: parallax al scrollear, se juntan con un click */
  const fl = $('floaters');
  const KINDS = ['oro', 'doblon', 'ficha', 'billete', 'dopamina', 'estrella', 'dado', 'pez'];
  const narrow = sc.clientWidth < 700, NF = narrow ? 8 : 16;
  const flos = [];
  for (let i = 0; i < NF; i++) {
    const left = i % 2 === 0;
    const size = Math.round((narrow ? 24 : 30) + Math.random() * (narrow ? 12 : 20));
    const x = left ? 7.5 + Math.random() * 2.5 : 92.5 - Math.random() * 2.5;   /* % del ancho: el borde visible arranca cerca del 7,5% */
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'flo'; b.setAttribute('aria-label', 'Juntar moneda');
    b.style.left = left ? x + '%' : 'calc(' + x + '% - ' + size + 'px)';
    b.style.width = size + 'px';

  }
  function parallax() {
    const mid = sc.scrollTop + sc.clientHeight / 2;
    flos.forEach((o) => { o.el.style.transform = 'translateY(' + ((o.y - mid) * o.depth * -0.35).toFixed(1) + 'px)'; });
  }
  fl.addEventListener('click', (e) => {
    const b = e.target.closest('.flo');
    if (!b || b.classList.contains('got')) return;

    window.dispatchEvent(new CustomEvent('dmx:collect'));

  });
  function sides() { setCh(currentCh()); parallax(); }
  placeFlos(); sides();
  let flW = sc.clientWidth;
  if ('ResizeObserver' in window) new ResizeObserver(() => {

    if (sc.clientWidth !== flW) { flW = sc.clientWidth; placeFlos(); }

  }).observe(rootEl);
  if (document.readyState !== 'complete') window.addEventListener('load', () => { placeFlos(); sides(); }, { once: true });   /* también recalcula el canal cuando cambia el alto (imágenes, fuentes) */

  /* ---- imágenes de las mesas: click para verlas en grande (resolución completa) ---- */
  (() => {
    const lb = $('lightbox'), im = $('lbImg'), cap = $('lbCap');
    const big = (img) => img && !img.closest('.hero,.tree-node,.flo,.rcpt,footer') && /\.(jpe?g|webp)$/i.test(img.getAttribute('src') || '');
    sc.querySelectorAll('img').forEach((img) => { if (big(img)) img.classList.add('zoomable'); });
    let last = null;
    function open(img) {
      last = img;

    }
    /* encima de cada imagen hay una capa de scanlines (.scan): el click cae ahí, así que buscamos la imagen de su marco */
    const imgOf = (t) => t.closest && (t.closest('img') || (t.closest('.tilt') && t.closest('.tilt').querySelector(':scope > img')));
    sc.addEventListener('click', (e) => { const img = imgOf(e.target); if (big(img)) open(img); });
    sc.querySelectorAll('.zoomable').forEach((img) => { const sn = img.parentElement.querySelector(':scope > .scan'); if (sn) sn.classList.add('zoomable'); });
    lb.addEventListener('click', close);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  /* ---- animaciones de texto con jerarquía visual (solo textos fijos; los que cambian ya tienen las suyas) ---- */
  if (!reduce && 'IntersectionObserver' in window) {
    const SKIP = '.hero,.rcpt,[aria-live],.tree-info,.tree-card,.psst,button,a,.lightbox';
    /* parte el texto en palabras (y letras) sin tocar los elementos internos */
    function split(el, chars) {
      let i = 0;
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((n) => {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach((part) => {
          if (!part) return;

          const w = document.createElement('span');
          if (chars) {
            w.className = 'tw';
            for (const ch of part) { const c = document.createElement('span'); c.className = 'tch'; c.style.setProperty('--i', i++); c.textContent = ch; w.appendChild(c); }
          } else { w.className = 'twd'; w.style.setProperty('--i', i++); w.textContent = part; }

    }
    const items = [];
    const add = (el, lvl) => { if (!el.dataset.tx && !el.closest(SKIP) && el.textContent.trim()) { el.dataset.tx = lvl; items.push(el); } };
    sc.querySelectorAll('h2').forEach((el) => add(el, '1'));
    sc.querySelectorAll('h3').forEach((el) => add(el, '2'));
    sc.querySelectorAll('p, th').forEach((el) => {
      const cs = getComputedStyle(el), ls = parseFloat(cs.letterSpacing) || 0;
      if (el.tagName === 'TH' || (parseFloat(cs.fontSize) <= 15 && ls >= 1 && el.textContent.trim().length < 40)) add(el, '3');
    });
    sc.querySelectorAll('p, td, span').forEach((el) => {
      if (el.closest('[data-tx]')) return;
      const own = [...el.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim());
      if (own) add(el, '4');
    });
    items.forEach((el) => {
      const lvl = el.dataset.tx;
      if (lvl === '1') split(el, true);
      else if (lvl === '2') split(el, false);
      else if (lvl === '3') el.dataset.n = split(el, true);
      else if (lvl === '4') split(el, false);
    });
    /* los de nivel 4 entran escalonados dentro de su bloque */
    const groups = new Map();
    items.filter((el) => el.dataset.tx === '4').forEach((el) => {
      const key = el.closest('li,section,footer,table') || sc;
      const k = groups.get(key) || 0; groups.set(key, k + 1);
      el.style.setProperty('--d', Math.min(k, 6) * 90 + 'ms');
    });
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        const el = e.target; io.unobserve(el);
        el.dataset.in = '';   /* atributos data-: Preact no los pisa al volver a dibujar */
        if (el.dataset.tx === '3') {   /* cursor de terminal mientras se escribe */
          el.dataset.typing = '';
          setTimeout(() => delete el.dataset.typing, (+el.dataset.n || 10) * 30 + 500);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
    items.forEach((el) => io.observe(el));

    /* textos del árbol: Preact los cambia al tocar un nodo (no se pueden partir en palabras),
       así que se revelan con un barrido cada vez que aparecen o cambian */
    const dyn = $('arboles') && $('arboles').querySelector('[aria-live]');   /* el panel de explicación del árbol */
    if (dyn) {
      let seen = false;

        if (!seen) return;

          const t = el.textContent;

  /* ---- íconos cayendo en el fondo del hero (decoración: sin interacción) ---- */
  (() => {
    const rain = $('heroRain'); if (!rain) return;
    const ICONS = ['billete', 'dado', 'doblon', 'dopamina', 'estrella', 'ficha', 'oro', 'pez', 'ruleta', 'ticket', 'espada'];
    /* variantes del mismo verde azulado del fondo: más claras y más oscuras */
    const TONES = [[1.15, 0.22], [0.95, 0.26], [1.35, 0.16], [0.45, 0.34], [0.6, 0.3]];   /* [brillo, opacidad] */
    /* tres capas de profundidad (lejos: chicos y lentos · cerca: grandes y rápidos). Dentro de cada capa todos
       caen a la misma velocidad, así que la distancia entre ellos se mantiene y nunca se amontonan:
       el ancho se reparte en franjas parejas y la altura de cada uno sale de la proporción áurea */
    const small = sc.clientWidth < 700;
    const LAYERS = small
      ? [{ n: 8, s: [20, 28], d: 96 }, { n: 7, s: [30, 40], d: 74 }, { n: 5, s: [42, 54], d: 56 }]
      : [{ n: 14, s: [30, 42], d: 100 }, { n: 12, s: [46, 62], d: 78 }, { n: 9, s: [66, 86], d: 58 }];
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
    let bag = [];
    const nextIcon = () => { if (!bag.length) bag = shuffle(ICONS.slice()); return bag.pop(); };   /* sin repetir hasta usar todos */
    LAYERS.forEach((L, li) => {
      const order = shuffle([...Array(L.n).keys()]), p0 = Math.random();
      for (let k = 0; k < L.n; k++) {
        const x = (order[k] + 0.2 + Math.random() * 0.6) / L.n * 100;                 /* una franja de ancho para cada uno */
        const ph = (p0 + k * 0.618034 + (Math.random() - 0.5) * 0.12) % 1;           /* altura: proporción áurea + un poco de azar */
        const d = L.d * (0.97 + Math.random() * 0.06), tone = TONES[(Math.random() * TONES.length) | 0];
        const size = L.s[0] + Math.random() * (L.s[1] - L.s[0]);
        const el = document.createElement('span'); el.className = 'rn';
        el.style.cssText = '--x:' + x.toFixed(1) + '%;--s:' + size.toFixed(0) + 'px;--d:' + d.toFixed(1) + 's;--dl:' + (-ph * d).toFixed(1) + 's;' +
          '--d2:' + (5 + Math.random() * 6).toFixed(1) + 's;--r0:' + (-40 + Math.random() * 30).toFixed(0) + 'deg;--r1:' + (10 + Math.random() * 40).toFixed(0) + 'deg;--y0:' + (ph * 70).toFixed(0) + 'cqh;' +
          '--b:' + tone[0] + ';--o:' + (tone[1] * (0.8 + li * 0.15)).toFixed(2);
        const im = document.createElement('img'); im.src = 'assets/' + nextIcon() + '.png'; im.alt = ''; im.draggable = false;
        el.appendChild(im);
        rain.appendChild(el);
      }
    });
  })();

  /* ================= hero: arrastrar de costado muestra el pitch conceptual ================= */
  const PITCH_URL = 'https://www.figma.com/proto/a0q3A0qSM0i1khoxkVobso/Trabajo--Copy---Copy---Copy---copia-?node-id=6019-2&p=f&scaling=scale-down-width&content-scaling=fixed&page-id=2090%3A2&starting-point-node-id=6019%3A2';
  const hero = $('hero'), track = $('heroTrack'), panel = $('pitchPanel'), frame = $('pitchFrame');
  let shown = 0;          /* 0: hero · -1: pitch entró por la derecha · 1: entró por la izquierda */
  let offset = 0, hdrag = null, justDragged = false;
  const W = () => sc.clientWidth;   /* ancho de la imagen completa (incluye lo que queda fuera de cuadro) */
  function setX(x, anim) {
    track.style.transition = anim && !reduce ? 'transform .6s cubic-bezier(.2,.8,.2,1)' : 'none';
    track.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0)';
    offset = x;
  }
  function loadPitch() {
    if (frame.getAttribute('src')) return;
    frame.setAttribute('src', 'https://www.figma.com/embed?embed_host=share&url=' + encodeURIComponent(PITCH_URL));
  }
  function settle(toShown) {
    const side = panel.classList.contains('from-left') ? 1 : -1;
    if ((shown !== 0) !== toShown) SFX.play('stat');

    if (toShown) { loadPitch(); railTxt.innerHTML = 'CH P · <b>Pitch conceptual</b>'; rail.classList.remove('sw'); void rail.offsetWidth; rail.classList.add('sw'); chNow = -1; }

  hero.addEventListener('dragstart', (e) => e.preventDefault());
  hero.addEventListener('pointerdown', (e) => {

      if (Math.abs(dy) > Math.abs(dx)) { hdrag = null; return; }    /* gesto vertical: es scroll, no arrastre */

  });
  function endDrag() {
    if (!hdrag) return;

    if (!d.moved) return;

    const frac = Math.abs(offset) / W();

  $('pitchBack').addEventListener('click', () => settle(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && shown) settle(false); });
  new ResizeObserver(() => { if (shown) setX(shown * W(), false); }).observe(sc);

  /* ---- diagrama de niveles de dopamina (en el hero) ----
     corre hacia la izquierda; lo que dibujás con el mouse queda grabado y viaja con la señal */
  const M = 220, H0 = 24, buf = new Float32Array(M).fill(H0), usr = new Uint8Array(M);
  let ph = 0;

    ph++;

  const sx = (i) => (i * 1000 / (M - 1)).toFixed(1);
  const sig = $('eegSig'), usrPath = $('eegUsr'), box = $('eegbox'), pen = $('eegPen'), svg = box.querySelector('svg');
  function draw() {
    let d = '';
    for (let i = 0; i < M; i++) d += (i ? 'L' : 'M') + sx(i) + ' ' + buf[i].toFixed(1);
    sig.setAttribute('d', d);
    let u = '', prev = false;
    for (let i = 0; i < M; i++) {
      if (usr[i]) { u += (prev ? 'L' : 'M') + sx(i) + ' ' + buf[i].toFixed(1); prev = true; } else prev = false;
    }
    usrPath.setAttribute('d', u);
  }
  let lastI = -1, lastV = H0, hoverAt = null;
  function write(e) {
    hoverAt = { clientX: e.clientX, clientY: e.clientY };
    const r = svg.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const v = Math.min(39, Math.max(1, (e.clientY - r.top) / r.height * 40));
    const i = Math.round(f * (M - 1));
    pen.style.left = (f * 100) + '%';
    if (lastI < 0) { lastI = i; lastV = v; }
    const a = Math.min(lastI, i), b = Math.max(lastI, i);
    for (let k = a; k <= b; k++) {
      const t = b === a ? 1 : (k - lastI) / (i - lastI);
      buf[k] = lastV + (v - lastV) * t; usr[k] = 1;
    }
    lastI = i; lastV = v;
    draw();
  }
  box.addEventListener('pointermove', write);
  let zapT = 0;
  box.addEventListener('pointermove', () => { const n = performance.now(); if (n - zapT > 55) { zapT = n; SFX.play('zap'); } });
  box.addEventListener('pointerdown', (e) => { lastI = -1; write(e); });
  box.addEventListener('pointerleave', () => { lastI = -1; hoverAt = null; });
  let acc = 0, prevT = performance.now();
  function eegLoop(t) {
    acc += t - prevT; prevT = t;
    let moved = false;
    while (acc > 45) {
      acc -= 45; moved = true;
      buf.copyWithin(0, 1); usr.copyWithin(0, 1);
      buf[M - 1] = gen(); usr[M - 1] = 0;
      if (lastI >= 0) lastI = Math.max(0, lastI - 1);
    }
    /* con el mouse quieto encima, la línea sigue escribiendo en el mismo lugar mientras la señal corre */
    if (moved && hoverAt && lastI >= 0) write(hoverAt);
    else if (moved && !document.hidden) draw();
    requestAnimationFrame(eegLoop);
  }
  draw();
  if (!reduce) requestAnimationFrame(eegLoop);
}, { once: true });

/* ---- reloj ---- */
const pad = (n) => String(n).padStart(2, '0');
function clock() { const d = new Date(); $('hudClock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
clock(); setInterval(clock, 1000);
})();
</script>
